meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Liquidação Pix</title>
    <script src="https://unpkg.com" crossorigin></script>
    <script src="https://unpkg.com" crossorigin></script>
    <script src="https://unpkg.com"></script>
    <script src="https://tailwindcss.com"></script>
</head>
<body>

    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        function App() {
            // Estado inicial com a carteira e saldos reais dos 6 personagens
            const [contas, setContas] = useState([
                { id: 1001, nome: 'Ana', saldo: 15000.00 },
                { id: 1002, nome: 'Joaquim', saldo: 1000.00 },
                { id: 1003, nome: 'Gabriel', saldo: 500.00 },
                { id: 1004, nome: 'João', saldo: 200.00 },
                { id: 1005, nome: 'Júlia', saldo: 50.00 },
                { id: 1006, nome: 'Rafael', saldo: 0.00 }
            ]);

            // Estados para gerenciar as seleções e alertas da tela
            const [remetenteId, setRemetenteId] = useState('');
            const [destinatarioId, setDestinatarioId] = useState('');
            const [valorPix, setValorPix] = useState('');
            const [statusMensagem, setStatusMensagem] = useState(null);

            const executarPixSimulado = (e) => {
                e.preventDefault();
                
                if (!remetenteId || !destinatarioId || !valorPix) {
                    setStatusMensagem({ tipo: 'erro', texto: 'Por favor, preencha todos os campos.' });
                    return;
                }

                if (remetenteId === destinatarioId) {
                    setStatusMensagem({ tipo: 'erro', texto: 'A conta de origem e destino não podem ser iguais.' });
                    return;
                }

                const valor = parseFloat(valorPix);
                if (valor <= 0 || isNaN(valor)) {
                    setStatusMensagem({ tipo: 'erro', texto: 'Insira um valor de transferência válido.' });
                    return;
                }

                const contaOrigem = contas.find(c => c.id === parseInt(remetenteId));
                
                // Validação de saldo (Regra de Negócio Crucial)
                if (contaOrigem.saldo < valor) {
                    setStatusMensagem({ 
                        tipo: 'erro', 
                        texto: `Transação Recusada: ${contaOrigem.nome} não possui saldo suficiente (Saldo: R$ ${contaOrigem.saldo.toFixed(2)}).` 
                    });
                    return;
                }

                // Atualização atômica simulada no Front-End
                const novasContas = contas.map(conta => {
                    if (conta.id === parseInt(remetenteId)) {
                        return { ...conta, saldo: conta.saldo - valor };
                    }
                    if (conta.id === parseInt(destinatarioId)) {
                        return { ...conta, saldo: conta.saldo + valor };
                    }
                    return conta;
                });

                setContas(novasContas);
                setStatusMensagem({ 
                    tipo: 'sucesso', 
                    texto: `Pix de R$ ${valor.toFixed(2)} enviado com sucesso! ID: ${Math.random().toString(36).substr(2, 9).toUpperCase()}` 
                });
